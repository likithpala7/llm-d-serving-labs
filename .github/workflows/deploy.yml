name: Deploy config changes

on:
  workflow_dispatch:

# Only one deploy at a time; queue rather than cancel a run in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLUSTER_NAME: llm-d-harness
      AWS_REGION: us-east-1
      NAMESPACE: llm-d-optimized-baseline
      GUIDE_NAME: optimized-baseline
    steps:
      - uses: actions/checkout@v4

      - name: DEBUG - decode actual OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{iss, aud, sub}' || echo "$TOKEN" | cut -d. -f2 | base64 -d

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::487825333846:role/github-actions-agent-harness-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Configure kubectl for the cluster
        run: |
          aws eks update-kubeconfig --name "${CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Pre-flight - verify the GPU node is up
        run: |
          if ! kubectl get nodes -l role=gpu --no-headers 2>/dev/null | grep -q Ready; then
            echo "::error::No Ready GPU node found. This repo's cost discipline tears the cluster/GPU node down between sessions - scale gpu-baseline up first:"
            echo "  eksctl scale nodegroup --cluster=${CLUSTER_NAME} --name=gpu-baseline --nodes=1 --nodes-min=0 --nodes-max=1 --region ${AWS_REGION}"
            exit 1
          fi

      - name: Clone llm-d (read-only reference for router base values)
        run: git clone --depth 1 https://github.com/llm-d/llm-d.git /tmp/llm-d

      - name: Apply vLLM model server manifests
        run: kubectl apply -n "${NAMESPACE}" -k infra/modelserver

      - name: Upgrade llm-d router
        run: |
          source <(tr -d '\r' < /tmp/llm-d/guides/env.sh)
          helm upgrade "${GUIDE_NAME}" "${ROUTER_STANDALONE_CHART}" \
            -f /tmp/llm-d/guides/recipes/router/base.values.yaml \
            -f /tmp/llm-d/guides/${GUIDE_NAME}/router/${GUIDE_NAME}.values.yaml \
            -f infra/router-resources-override.values.yaml \
            -n "${NAMESPACE}" --version "${ROUTER_CHART_VERSION}"

      - name: Wait for the decode pod to roll out
        run: |
          kubectl -n "${NAMESPACE}" rollout status deployment/optimized-baseline-nvidia-gpu-vllm-decode --timeout=15m

      - name: Summary
        run: |
          echo "### Deploy complete :rocket:" >> "$GITHUB_STEP_SUMMARY"
          kubectl get pods -n "${NAMESPACE}" >> "$GITHUB_STEP_SUMMARY"
