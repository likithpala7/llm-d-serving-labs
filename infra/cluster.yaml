apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: llm-d-harness
  region: us-east-1          # adjust to your preferred region; confirm g5 capacity there
  version: "1.31"

# All AZs EKS actually supports for the control plane in us-east-1 — not
# us-east-1e, which EKS rejects outright ("EKS does not support creating
# control plane instances in us-east-1e", confirmed 2026-09-30). Using all
# 5 valid ones (not a fixed subset) because g5.2xlarge capacity shifts
# unpredictably between AZs (observed InsufficientInstanceCapacity rotate
# across f/b, then a/c/d, within minutes of each other on 2026-09-30) —
# maximizing AZ coverage gives the node group's ASG the most chances to
# land wherever capacity actually is at launch time.
availabilityZones: ["us-east-1a", "us-east-1b", "us-east-1c", "us-east-1d", "us-east-1f"]

vpc:
  nat:
    gateway: Single           # 1 NAT gateway instead of eksctl's default of one per AZ

managedNodeGroups:
  - name: system
    instanceType: m5.large     # 2 vCPU / 8GB — enough for router/EPP/monitoring pods, much cheaper than xlarge
    desiredCapacity: 1
    minSize: 1
    maxSize: 2
    labels:
      role: system

  - name: gpu-baseline
    # .xlarge, not .2xlarge — 4 vCPUs each, not 8. This is deliberate:
    # the G/VT quota (L-DB2E81BA) is an account-wide ceiling on total
    # vCPUs across all concurrently-running G-family instances, and a
    # request to raise it from 8 to 16 (for phase 2's 2 concurrent GPUs)
    # was denied outright 2026-10-13 — AWS Billing support said this
    # particular quota is gated to the Sales/account-manager channel,
    # not self-service Service Quotas, full stop. .xlarge variants have
    # the same GPU model and VRAM as their .2xlarge counterparts (just
    # half the vCPU/system-RAM), so maxSize: 2 here (2 x 4 vCPU = 8)
    # fits entirely within the quota we already have approved — no
    # Sales conversation needed. infra/modelserver's resource requests
    # were retuned to match (4 vCPU/16GiB per node, not 8/32).
    # g4dn.xlarge (T4, 16GB VRAM) deliberately excluded: too tight for
    # Qwen3-8B's ~15.27GB bf16 weights alone.
    instanceTypes: ["g5.xlarge", "g6.xlarge", "g6e.xlarge"]
    amiFamily: AmazonLinux2023  # eksctl resolves the GPU-enabled AL2023 variant automatically
    desiredCapacity: 0         # 0 by default — scale up explicitly when needed
    minSize: 0
    maxSize: 2
    volumeSize: 100             # model weights + container images add up fast
    labels:
      role: gpu
    taints:
      - key: nvidia.com/gpu
        value: "true"
        effect: NoSchedule
