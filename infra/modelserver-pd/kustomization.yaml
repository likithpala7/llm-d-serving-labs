# see CLAUDE.md's llm-d specifics section. Vendored as flattened plain
# manifests here (not kustomize bases/components referencing the llm-d
# clone), same pattern as infra/modelserver/ for phase 1.
resources:
  - serviceaccount.yaml
  - prefill-deployment.yaml
  - decode-deployment.yaml
