apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Phase 2 prefill/decode disaggregation, 2 single-GPU instances. Derived
# from llm-d's guides/pd-disaggregation/modelserver/gpu/vllm/base
# (INFRA_PROVIDER=base, NixlConnector), trimmed from the guide's
# 8x-prefill + 2x-decode(TP=4) gpt-oss-120b topology down to the project's
